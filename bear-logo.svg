<svg viewBox="0 0 220 175" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="gM" x1="30%" y1="0%" x2="70%" y2="100%">
      <stop offset="0%" stop-color="#00e8ff"/>
      <stop offset="50%" stop-color="#0099ff"/>
