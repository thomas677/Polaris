<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 450">
  <defs>
    <linearGradient id="gTop" x1="60%" y1="0%" x2="40%" y2="100%">
      <stop offset="0%"   stop-color="#00eaff"/>
      <stop offset="35%"  stop-color="#00b4ff"/>
      <stop offset="70%"  stop-color="#0077ff"/>
      <stop offset="100%" stop-color="#0044dd"/>
    </linearGradient>
    <linearGradient id="gShadow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#0055bb"/>
      <stop offset="100%" stop-color="#002299"/>
    </linearGradient>
    <linearGradient id="gDark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#003faa"/>
      <stop offset="100%" stop-color="#001a77"/>
    </linearGradient>
    <linearGradient id="gAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#0088ee"/>
      <stop offset="100%" stop-color="#0055cc"/>
    </linearGradient>
  </defs>

  <!-- ── MAIN BODY SILHOUETTE ── -->
  <path d="
    M 458,158
    C 472,145 476,125 466,108
    C 458,94  442,82  428,76
    L 420,55  L 408,42  L 400,22
    L 388,30  L 378,22  L 372,35
    L 380,50  L 392,62
    C 378,56  360,52  342,56
    L 310,62  L 268,64  L 220,66  L 168,72  L 120,82
    L 78,96   L 48,115  L 28,138  L 18,160  L 22,182
    L 28,198
    C 18,208  22,228  36,232
    L 62,232
    L 52,418  L 76,425  L 92,232
    L 120,232
    L 110,418  L 134,425  L 150,232
    C 178,238  208,238  232,234
    L 244,232
    L 234,418  L 258,425  L 278,232
    L 305,228
    L 295,418  L 320,425  L 338,225
    C 365,212  400,188  425,170
    C 440,164  452,160  458,158 Z
  " fill="url(#gTop)"/>

  <!-- ── BELLY SHADOW (dark underside between legs) ── -->
  <path d="
    M 38,212
    C 62,200  100,195  148,196
    C 195,197  235,200  278,205
    L 318,210  L 322,225  L 278,220
    C 232,215  192,212  148,211
    C 100,210  60,215  36,228 Z
  " fill="url(#gShadow)" opacity="0.6"/>

  <!-- ── CHEST LIGHTNING SPIKE ── -->
  <path d="M 338,228 L 318,208 L 340,198 Z" fill="url(#gDark)" opacity="0.65"/>

  <!-- ── BELLY SPIKE (mid) ── -->
  <path d="M 232,234 L 218,215 L 246,215 Z" fill="url(#gDark)" opacity="0.55"/>

  <!-- ── BELLY SPIKE (front-back junction) ── -->
  <path d="M 152,232 L 138,212 L 165,210 Z" fill="url(#gDark)" opacity="0.5"/>

  <!-- ── HAUNCH SHADOW (left rump) ── -->
  <path d="
    M 28,198 C 42,188 65,190 75,205
    L 68,225 C 55,215 35,215 25,225 Z
  " fill="url(#gShadow)" opacity="0.55"/>

  <!-- ── LEG INNER SHADOWS ── -->
  <!-- Front right inner -->
  <path d="M 305,228 L 320,228 L 312,418 L 296,418 Z" fill="url(#gDark)" opacity="0.38"/>
  <!-- Front left inner -->
  <path d="M 150,232 L 165,232 L 158,418 L 142,418 Z" fill="url(#gDark)" opacity="0.32"/>
  <!-- Back right inner -->
  <path d="M 120,232 L 134,232 L 128,418 L 112,418 Z" fill="url(#gDark)" opacity="0.32"/>
  <!-- Back left inner -->
  <path d="M 62,232 L 76,232 L 70,418 L 55,418 Z"  fill="url(#gDark)" opacity="0.28"/>

  <!-- ── BACK / SPINE HIGHLIGHT ── -->
  <path d="M 340,58 C 305,54 265,54 220,57 C 178,60 140,70 105,84 C 78,94 52,112 38,132"
    stroke="#55eeff" stroke-width="6" fill="none" stroke-linecap="round" opacity="0.45"/>

  <!-- ── HEAD / SHOULDER HIGHLIGHT ── -->
  <path d="M 390,64 C 372,58 355,56 342,58"
    stroke="#88f0ff" stroke-width="4" fill="none" stroke-linecap="round" opacity="0.5"/>

  <!-- ── EAR INNER ── -->
  <polygon points="378,24 388,32 400,24 392,64" fill="#0044bb" opacity="0.6"/>

  <!-- ── EYE ── -->
  <circle cx="410" cy="88" r="9"   fill="#001155"/>
  <circle cx="412" cy="86" r="3.8" fill="#99eeff"/>

  <!-- ── NOSE ── -->
  <ellipse cx="472" cy="120" rx="10" ry="7.5" fill="#001155"/>
  <ellipse cx="471" cy="119" rx="5"  ry="3.8" fill="#000830"/>

  <!-- ── SUBTLE MOUTH ── -->
  <path d="M 463,130 C 466,136 472,138 476,135"
    stroke="#001155" stroke-width="2.5" fill="none" stroke-linecap="round" opacity="0.7"/>
</svg>
