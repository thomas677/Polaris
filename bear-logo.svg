  <!-- Eye -->
  <circle cx="200" cy="58" r="6.5" fill="#001055"/>
  <circle cx="201.8" cy="56.5" r="2.8" fill="#88eeff"/>

  <!-- Nose -->
  <ellipse cx="214" cy="83" rx="7" ry="5.5" fill="#001055"/>
  <ellipse cx="213" cy="82" rx="3.5" ry="2.8" fill="#00082e"/>

  <!-- Ear inner detail -->
